name: PROJECT OMEGA - Android Build and Test

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: SK MASTER AI Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Extract OMEGA ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . -type f -iname "*.zip" \
              -not -path "./.git/*"
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "Expected one OMEGA ZIP."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/omega"
          unzip -q "${ZIPS[0]}" \
            -d "$RUNNER_TEMP/omega"

          SETTINGS=$(find "$RUNNER_TEMP/omega" \
            -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Android Gradle settings not found."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")

          echo "ANDROID_DIR=$ANDROID_DIR" \
            >> "$GITHUB_ENV"

          echo "Android project located."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Required Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
            


      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK Components
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: ${{ env.ANDROID_DIR }}

      - name: Run Unit Tests
        run: gradle --no-daemon testDebugUnitTest
        working-directory: ${{ env.ANDROID_DIR }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-OMEGA-DEBUG-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
