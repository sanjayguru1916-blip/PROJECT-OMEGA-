name: PROJECT OMEGA - Phase 0 Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  omega-audit:
    name: SK MASTER AI Project Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -type f -iname "*.zip" \
              -not -path "./.git/*"
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "Expected exactly one project ZIP."
            echo "Found: ${#ZIPS[@]}"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/omega-source"
          unzip -q "${ZIPS[0]}" \
            -d "$RUNNER_TEMP/omega-source"

          PACKAGE_FILE=$(find \
            "$RUNNER_TEMP/omega-source" \
            -type f -name package.json | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE_FILE")
          echo "PROJECT_ROOT=$PROJECT_ROOT" \
            >> "$GITHUB_ENV"

          echo "Project extracted successfully."
          echo "Project root: $PROJECT_ROOT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install --no-package-lock
        working-directory: ${{ env.PROJECT_ROOT }}

      - name: TypeScript Check
        run: npm run lint
        working-directory: ${{ env.PROJECT_ROOT }}

      - name: Production Build
        run: npm run build
        working-directory: ${{ env.PROJECT_ROOT }}

      - name: Android Readiness Check
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          echo "Checking Android project..."

          test -f android/app/src/main/AndroidManifest.xml

          find android -type f -name "*.kt" \
            | tee "$RUNNER_TEMP/kotlin-files.txt"

          echo "Kotlin files:"
          wc -l "$RUNNER_TEMP/kotlin-files.txt"

          if [ -f android/gradlew ]; then
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper missing."
            echo "Android build not verified."
          fi

      - name: Audit Summary
        if: always()
        run: |
          echo "PROJECT OMEGA AUDIT"
          echo "Source archive extraction attempted."
          echo "See previous steps for actual results."
          
